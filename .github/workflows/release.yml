name: Release

# Publishes to npm via trusted publishing (OIDC): no NPM_TOKEN secret.
# Configure the trusted publisher on npmjs.com under
# @bindist/client -> Settings -> Trusted Publisher:
#   GitHub Actions, BinDist/bindist-api-javascript, workflow release.yml

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: published
        run: |
          NAME_VERSION="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$NAME_VERSION" version >/dev/null 2>&1; then
            echo "$NAME_VERSION is already published, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.exists != 'true'
        run: npm ci

      # prepublishOnly runs lint, typecheck and build; provenance is automatic
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish
